server {
  listen 8081;
  server_name portal.test;
  root /var/www/devops-lab;
  index index.html;
  location = /whoami {
    default_type text/plain;
    return 200 "nginx-vm1\n";
  }
  location = /health {
    proxy_pass http://app.lab.test:8000;
    #default_type text/plain;
    #return 200 "proxy-alive\n";
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
