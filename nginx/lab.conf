server {
  listen 8081;
  server_name _;
  root /var/www/devops-lab;
  index index.html;
  location = /whoami {
    default_type text/plain;
    return 200 "nginx-vm1\n";
  }
  location = /health {
    proxy_pass http://10.0.0.211:8000;
    #default_type text/plain;
    #return 200 "proxy-alive\n";
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
